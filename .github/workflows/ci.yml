name: Planova CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build and API checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planova
          POSTGRES_PASSWORD: planova
          POSTGRES_DB: planova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planova -d planova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://planova:planova@localhost:5432/planova?schema=public
      JWT_SECRET: planova_ci_jwt_secret
      JWT_EXPIRES_IN: 1d
      NODE_ENV: development
      PORT: 8889
      DEV_PLAN_SWITCH_ENABLED: "true"
      DEV_EMAIL_LOGIN_ENABLED: "true"
      GOOGLE_CALLBACK_URL: http://localhost:8889/auth/google/callback
      REDIS_ENABLED: "false"
      PLANOVA_BASE_URL: http://localhost:8889

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Run service unit tests
        run: npm run test:unit

      - name: Start compiled backend
        run: |
          npm run start > /tmp/planova-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS "$PLANOVA_BASE_URL/health"; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/planova-server.log
          exit 1

      - name: Run smoke test
        run: npm run smoke

      - name: Run API test
        run: npm run test:api
