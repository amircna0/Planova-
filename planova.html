<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planova — plan your year, achieve your vision</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

:root{
  /* the mesh behind the glass — softened for readability */
  --bg: rgba(255,255,255,0.55);
  --surface: rgba(255,255,255,0.72);
  --border: rgba(20,22,46,0.08);
  --glass-edge: rgba(255,255,255,0.8);
  --ink: #23253F;
  --ink-soft: rgba(35,37,63,0.72);
  --ink-faint: rgba(35,37,63,0.52);

  /* soft periwinkle — the one accent, dialed down */
  --primary: #6C7CF0;
  --primary-dark: #4E5CD6;
  --primary-soft: rgba(108,124,240,0.13);

  --blue: #4FA3F7;   --blue-soft:rgba(79,163,247,0.13);
  --pink: #F16DA0;   --pink-soft:rgba(241,109,160,0.13);
  --green: #4ECB82;  --green-soft:rgba(78,203,130,0.14);
  --amber: #F4B740;  --amber-soft:rgba(244,183,64,0.16);
  --purple:#B27EE8;  --purple-soft:rgba(178,126,232,0.14);
  --red:   #F17164;  --red-soft:rgba(241,113,100,0.13);

  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --shadow: 0 8px 26px rgba(60,70,150,0.08), inset 0 1px 0 rgba(255,255,255,0.65);
  --shadow-lift: 0 18px 42px rgba(60,70,150,0.13), inset 0 1px 0 rgba(255,255,255,0.75);
}
*{ box-sizing:border-box; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

body{
  margin:0; color: var(--ink);
  font-family:'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  min-height:100vh;
  background-color:#F7F8FD;
  background-image:
    radial-gradient(circle at 12% 15%, rgba(108,124,240,0.22) 0%, transparent 52%),
    radial-gradient(circle at 88% 12%, rgba(241,109,160,0.16) 0%, transparent 50%),
    radial-gradient(circle at 18% 90%, rgba(79,163,247,0.18) 0%, transparent 52%),
    radial-gradient(circle at 92% 85%, rgba(178,126,232,0.16) 0%, transparent 50%),
    linear-gradient(160deg, #FAFAFE 0%, #FDF9FC 100%);
  background-attachment: fixed;
  background-repeat: no-repeat;
}
h1,h2,h3{ font-family:'Manrope', sans-serif; margin:0; font-weight:700; letter-spacing:-0.015em; }
button, input, textarea{ font-family: inherit; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background: rgba(20,22,46,0.16); border-radius: 8px; }

/* numeric / data typography */
.ring-pct, .stat-num, .date-badge .d, .mini-icon-circle, .priority-num,
.bar-pct, .budget-amt, .month-chip-val, .habit-dot[data-done="true"]{
  font-family:'IBM Plex Mono', monospace;
}

/* every frosted surface gets the same refraction */
.card, .date-nav, .icon-btn, .bell-btn, .tile, .quote-card, .sidebar,
.goal-card, .note-card, .month-chip, .cal-cell, .habit-emoji,
.mini-add input, .mini-add select, textarea.plain{
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
}

/* ---------------- App shell ---------------- */
.app{ display:grid; grid-template-columns: 258px 1fr; min-height:100vh; }
@media (max-width: 880px){ .app{ grid-template-columns: 1fr; } .sidebar{ position: static; height:auto; margin:12px; } }

.sidebar{
  background: linear-gradient(190deg, rgba(255,255,255,0.75), rgba(255,255,255,0.55));
  border:1px solid var(--glass-edge);
  padding: 22px 14px; display:flex; flex-direction:column; gap:22px;
  position: sticky; top:16px; height:calc(100vh - 32px);
  margin: 16px 0 16px 16px;
  border-radius: var(--radius-lg);
  overflow-y:auto;
  color: var(--ink);
  box-shadow: 0 16px 40px rgba(60,70,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7);
}
.brand{ display:flex; align-items:center; gap:11px; padding: 4px 8px 16px; border-bottom:1px solid var(--border); }
.brand-mark{
  width:34px; height:34px; border-radius:50%; flex-shrink:0; position:relative;
  background: radial-gradient(circle at 32% 28%, #ffffff 0%, #DCE1FC 20%, var(--primary) 58%, var(--primary-dark) 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.6) inset, 0 4px 12px rgba(108,124,240,0.35);
}
.brand-mark::after{ content:''; position:absolute; top:5px; left:7px; width:9px; height:6px; border-radius:50%; background:rgba(255,255,255,0.9); filter:blur(1px); }
.brand-name{ font-family:'Manrope', sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.02em; color:var(--ink); }

.nav-group{ display:flex; flex-direction:column; gap:3px; }
.nav-item{
  display:flex; align-items:center; gap:11px; padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--ink-soft); font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; background:transparent;
  text-align:left; width:100%; transition: all 0.15s ease;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; }
.nav-item:hover{ background: rgba(255,255,255,0.6); color: var(--ink); }
.nav-item[data-active="true"]{ background: rgba(255,255,255,0.85); color: var(--primary-dark); border-color: var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 12px rgba(108,124,240,0.16); }
.nav-item:focus-visible{ outline:2px solid var(--primary); outline-offset:1px; }
.nav-divider{ height:1px; background: var(--border); margin: 8px 4px; }

.sidebar-spacer{ flex:1; }
.profile-card{ display:flex; align-items:center; gap:10px; padding:10px; border-radius: var(--radius-sm); border:1px solid var(--glass-edge); background:rgba(255,255,255,0.5); }
.avatar{ width:34px; height:34px; border-radius:50%; background: radial-gradient(circle at 32% 28%, #fff, var(--primary) 65%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex-shrink:0; font-family:'IBM Plex Mono',monospace; }
.profile-name{ font-size:13px; font-weight:700; line-height:1.3; color:var(--ink); }
.profile-email{ font-size:11px; color: var(--ink-faint); }

/* ---------------- Main ---------------- */
.main{ padding: 30px 34px 60px; max-width: 1180px; }
.topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; gap:16px; flex-wrap:wrap; }
.page-title{ font-size: 30px; font-weight:800; margin-bottom:5px; position:relative; display:inline-block; color:var(--ink); }
.page-title::after{ content:''; position:absolute; left:1px; bottom:-6px; width:34px; height:3px; border-radius:3px; background:linear-gradient(90deg, var(--primary), var(--pink)); }
.page-sub{ font-size:14px; color: var(--ink-soft); margin:10px 0 0; }
.topbar-actions{ display:flex; align-items:center; gap:12px; }
.date-nav{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--glass-edge); border-radius:999px; padding:6px 8px; box-shadow: var(--shadow); }
.icon-btn{ width:28px; height:28px; border-radius:50%; border:1px solid var(--glass-edge); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); transition:all .15s ease; }
.icon-btn:hover{ background:var(--primary); color:#fff; border-color:var(--primary); }
.icon-btn svg{ width:14px; height:14px; }
.date-nav-label{ font-weight:700; font-size:13px; min-width:52px; text-align:center; font-family:'IBM Plex Mono',monospace; }
.bell-btn{ width:38px; height:38px; border-radius:50%; background:var(--surface); border:1px solid var(--glass-edge); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); box-shadow:var(--shadow); }
.bell-btn svg{ width:17px; height:17px; }

.card{ background:var(--surface); border:1px solid var(--glass-edge); border-radius: var(--radius-lg); padding:22px; box-shadow: var(--shadow); position:relative; overflow:hidden; }
.card::before{ content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent); }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.card-title{ font-size:13px; font-weight:700; font-family:'Manrope',sans-serif; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); }
.link-btn{ border:none; background:none; color:var(--primary); font-size:12px; font-weight:700; cursor:pointer; }
.link-btn:hover{ text-decoration:underline; }
.link-btn[data-primary="true"]{ background:var(--ink); border:1px solid var(--ink); color:#fff; border-radius:10px; padding:8px 10px; }

.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns: 1fr 1fr; }
.grid-3{ grid-template-columns: repeat(3,1fr); }
@media (max-width: 900px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

.view{ display:none; } .view[data-active="true"]{ display:block; }

/* progress ring */
.ring-box{ display:flex; align-items:center; gap:22px; }
.ring-wrap{ position:relative; width:104px; height:104px; flex-shrink:0; }
.ring-wrap svg{ transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:var(--border); stroke-width:9; }
.ring-fill{ fill:none; stroke:var(--primary); stroke-width:9; stroke-linecap:round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-pct{ font-size:21px; font-weight:700; }
.ring-caption{ font-size:9.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
.stat-cols{ display:flex; gap:22px; flex-wrap:wrap; }
.stat-col{ display:flex; flex-direction:column; gap:2px; }
.stat-num{ font-size:18px; font-weight:700; }
.stat-label{ font-size:11px; color:var(--ink-faint); font-weight:600; }

/* goal / life-area cards */
.goal-card{ background:var(--bg); border-radius: var(--radius-md); padding:14px; position:relative; border:1px solid var(--glass-edge); transition:all .15s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
.goal-card:hover{ border-color:rgba(255,255,255,0.85); transform: translateY(-1px); }
.goal-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:10px; }
.goal-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
.bar-track{ height:6px; background:var(--border); border-radius:999px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; transition: width .4s ease; background-image: linear-gradient(90deg, rgba(255,255,255,0.18), transparent); }
.bar-row{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.bar-pct{ font-size:11px; font-weight:700; color:var(--ink-soft); }
.stepper{ display:flex; gap:4px; opacity:0; transition:opacity .15s ease; }
.goal-card:hover .stepper, .area-row:hover .stepper{ opacity:1; }
.step-btn{ width:18px; height:18px; border-radius:5px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
.step-btn:hover{ background:var(--ink); color:#F6F4E9; }
.goal-del{ position:absolute; top:10px; right:10px; border:none; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; font-size:12px; }
.goal-card:hover .goal-del{ opacity:1; }
.goal-del:hover{ color:var(--red); }
.goal-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.goal-actions .link-btn{ background:var(--surface); border:1px solid var(--glass-edge); border-radius:10px; padding:7px 9px; text-decoration:none; }
.roadmap-meta{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
.roadmap-pill{ background:var(--surface); border:1px solid var(--glass-edge); border-radius:10px; padding:7px 6px; min-width:0; }
.roadmap-pill strong{ display:block; font-size:13px; color:var(--ink); }
.roadmap-pill span{ display:block; font-size:10px; color:var(--ink-faint); font-weight:700; }
.roadmap-panel{ display:flex; flex-direction:column; gap:12px; }
.roadmap-item{ border:1px solid var(--glass-edge); border-radius:var(--radius-md); padding:12px; background:rgba(255,255,255,0.48); }
.roadmap-week{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.roadmap-task{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px; font-weight:600; }
.roadmap-task-dot{ width:7px; height:7px; border-radius:50%; background:var(--primary); flex-shrink:0; }
.plan-feature-list{ display:flex; flex-direction:column; gap:7px; margin:12px 0; }
.plan-feature-list div{ font-size:12px; color:var(--ink-soft); font-weight:600; }
.plan-feature-list div::before{ content:'✓'; color:var(--green); margin-right:7px; font-weight:800; }

/* months overview */
.months-row{ display:grid; grid-template-columns: repeat(6,1fr); gap:10px; }
@media (max-width:760px){ .months-row{ grid-template-columns: repeat(3,1fr); } }
.month-chip{ border:1px solid var(--glass-edge); background:var(--bg); border-radius:16px; padding:10px 6px; text-align:center; cursor:pointer; transition:all .15s ease; }
.month-chip:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }
.month-chip[data-current="true"]{ border-color:var(--primary); background:var(--primary-soft); }
.month-chip-name{ font-size:12px; font-weight:700; margin-bottom:4px; font-family:'Manrope',sans-serif; }
.month-chip-val{ font-size:11px; color:var(--ink-faint); font-weight:600; }
.month-chip-val[data-done="true"]{ color:var(--green); }

/* life areas */
.area-row{ display:flex; align-items:center; gap:12px; padding:8px 0; }
.area-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.area-name{ width:118px; font-size:13px; font-weight:600; flex-shrink:0; }
.area-track{ flex:1; }

/* important dates */
.date-row{ display:flex; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
.date-row:last-child{ border-bottom:none; }
.date-badge{ width:42px; flex-shrink:0; text-align:center; background:linear-gradient(160deg, var(--primary), var(--primary-dark)); border-radius:12px; padding:5px 0; box-shadow:0 4px 12px rgba(108,124,240,0.28); }
.date-badge .d{ font-size:14px; font-weight:700; line-height:1.1; color:#fff; }
.date-badge .m{ font-size:9px; color:rgba(255,255,255,0.75); font-weight:700; text-transform:uppercase; }
.date-title{ font-size:13px; font-weight:600; }
.date-sub{ font-size:11px; color:var(--ink-faint); }
.date-del{ margin-left:auto; border:none; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; }
.date-row:hover .date-del{ opacity:1; }

/* quote card — a droplet of light on the glass */
.quote-card{ background: linear-gradient(160deg, rgba(255,255,255,0.65), rgba(255,255,255,0.4)); border-color: var(--glass-edge); position:relative; overflow:hidden; }
.quote-card::before{ content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(108,124,240,0.28), transparent 70%); filter:blur(2px); }
.quote-card::after{ content:''; position:absolute; bottom:-30px; left:-30px; width:90px; height:90px; border-radius:50%; background:radial-gradient(circle at 40% 30%, rgba(241,109,160,0.22), transparent 70%); filter:blur(2px); }
.quote-text{ font-family:'Manrope', sans-serif; font-size:18px; font-weight:600; line-height:1.45; color:var(--ink); border:none; background:transparent; width:100%; resize:none; outline:none; position:relative; }
.quote-mark{ font-family:'Manrope',sans-serif; font-size:34px; font-weight:800; color:var(--primary); line-height:1; margin-bottom:2px; position:relative; }

/* small forms */
.mini-add{ display:flex; gap:8px; }
.mini-add input, .mini-add select{ flex:1; border:1px solid var(--glass-edge); border-radius:12px; padding:9px 11px; font-size:13px; outline:none; background:var(--bg); color:var(--ink); }
.mini-add input:focus, .mini-add select:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.mini-add button{ border:none; background:linear-gradient(160deg, var(--primary), var(--primary-dark)); color:#fff; border-radius:12px; padding:0 14px; cursor:pointer; font-weight:700; transition:all .15s ease; box-shadow:0 4px 12px rgba(108,124,240,0.28); }
.mini-add button:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(108,124,240,0.35); }

/* calendar (monthly) */
.month-layout{ display:grid; grid-template-columns: 1.5fr 1fr; gap:20px; align-items:start; }
@media (max-width:980px){ .month-layout{ grid-template-columns:1fr; } }
.weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
.weekday-row span{ font-size:11px; font-weight:700; color:var(--ink-faint); text-align:center; text-transform:uppercase; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-cell{ aspect-ratio:1/0.82; border-radius:14px; border:1px solid transparent; background:var(--bg); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:all .12s ease; font-weight:700; font-size:13px; color:var(--ink); position:relative; font-family:'IBM Plex Mono',monospace; }
.cal-cell:hover{ border-color:var(--glass-edge); }
.cal-cell[data-muted="true"]{ opacity:0.32; }
.cal-cell[data-selected="true"]{ background:linear-gradient(160deg, var(--primary), var(--primary-dark)); color:#fff; box-shadow:0 4px 14px rgba(108,124,240,0.3); }
.cal-cell[data-today="true"]:not([data-selected="true"]){ border-color:var(--primary); color:var(--primary-dark); background:var(--primary-soft); }
.cal-dot{ position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.6; }

.priority-item{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.priority-num{ width:20px; height:20px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.priority-text{ font-size:13px; font-weight:600; flex:1; }
.priority-text[data-done="true"]{ text-decoration:line-through; color:var(--ink-faint); }
.pcheck{ width:16px; height:16px; border-radius:50%; border:2px solid var(--ink-faint); background:transparent; cursor:pointer; flex-shrink:0; }
.pcheck[data-done="true"]{ background:var(--green); border-color:var(--green); }

.progress-line{ display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px; }
.mini-icon-row{ display:flex; gap:14px; flex-wrap:wrap; }
.mini-icon{ display:flex; flex-direction:column; align-items:center; gap:6px; width:56px; }
.mini-icon-circle{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; position:relative; border:1px solid var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
.mini-icon-pct{ font-size:10px; font-weight:700; color:var(--ink-soft); }
.mini-icon-name{ font-size:9px; color:var(--ink-faint); font-weight:600; text-align:center; }

/* habit tracker grid */
.habit-table{ width:100%; border-collapse:collapse; }
.habit-table th{ font-size:10px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; padding-bottom:8px; letter-spacing:0.04em; }
.habit-table td{ padding: 6px 4px; text-align:center; }
.habit-name-cell{ display:flex; align-items:center; gap:8px; text-align:left; font-size:13px; font-weight:600; }
.habit-emoji{ width:26px; height:26px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; background:var(--bg); border:1px solid var(--glass-edge); }
.habit-dot{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--glass-edge); background:var(--surface); cursor:pointer; margin:0 auto; transition:all .12s ease; }
.habit-dot[data-done="true"]{ background:linear-gradient(160deg,#8CE0AC,var(--green)); border-color:var(--green); box-shadow:0 3px 10px rgba(78,203,130,0.35); }
.habit-del{ border:none; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; }
tr:hover .habit-del{ opacity:1; }

/* schedule (daily) */
.sched-row{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
.sched-row:last-child{ border-bottom:none; }
.sched-time{ width:64px; flex-shrink:0; font-size:11px; font-weight:700; color:var(--ink-faint); padding-top:2px; font-family:'IBM Plex Mono',monospace; }
.sched-bar{ width:3px; align-self:stretch; border-radius:3px; flex-shrink:0; }
.sched-label{ font-size:13px; font-weight:600; flex:1; }
.sched-del{ border:none; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; }
.sched-row:hover .sched-del{ opacity:1; }

/* notes / list items */
.note-card{ background:var(--bg); border-radius: var(--radius-md); padding:12px 14px; position:relative; border:1px solid var(--glass-edge); }
.note-txt{ font-size:13px; font-weight:500; line-height:1.5; white-space:pre-wrap; }
.note-meta{ font-size:10px; color:var(--ink-faint); margin-top:6px; font-weight:600; }
.note-del{ position:absolute; top:10px; right:10px; border:none; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; }
.note-card:hover .note-del{ opacity:1; }

/* empty state */

<script>
/* ============ ICONS ============ */
function svg(paths, extra){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`; }
const ICON = {

  x: svg('<path d="M18 6L6 18M6 6l12 12"/>'),
};
document.getElementById('navGroup').innerHTML = document.getElementById('navGroup').innerHTML.replace(/\$\{ICON\.(\w+)\}/g, (m,k)=>ICON[k]||'');

/* ============ STATE ============ */
const KEYS = {
  goals:'planova:goals', areas:'planova:areas', tasks:'planova:tasks', sched:'planova:sched',
  habits:'planova:habits', budget:'planova:budget', notes:'planova:notes', dates:'planova:dates',
  reflections:'planova:reflections', focus:'planova:focus', quote:'planova:quote'
};
let S = { goals:[], areas:[], tasks:[], sched:[], habits:[], budget:{}, notes:[], dates:[], reflections:{}, focus:{}, quote:'' };
let view = 'home';
let annualYear = new Date().getFullYear();
let monthCursor = new Date();
let dayCursor = new Date();
let selectedMonthDay = fmt(new Date());
let habitWeekStart = startOfWeek(new Date());

const GOAL_COLORS = { blue:['var(--blue)','var(--blue-soft)'], pink:['var(--pink)','var(--pink-soft)'], green:['var(--green)','var(--green-soft)'], purple:['var(--purple)','var(--purple-soft)'], amber:['var(--amber)','var(--amber-soft)'] };
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const LIFE_AREA_META = {
  career:{ name:'Career', icon:'🎯', color:'blue', css:'var(--blue)' },
  health:{ name:'Health', icon:'❤️', color:'pink', css:'var(--green)' },
  money:{ name:'Money', icon:'💰', color:'green', css:'var(--amber)' },
  learning:{ name:'Learning', icon:'📚', color:'purple', css:'var(--purple)' },
  relationships:{ name:'Relationships', icon:'🏡', color:'pink', css:'var(--pink)' },
  personal_growth:{ name:'Personal Growth', icon:'✦', color:'blue', css:'var(--blue)' },
};
const API_BASE = window.location.origin;
let apiToken = localStorage.getItem('planova:token') || '';
let apiUserEmail = localStorage.getItem('planova:email') || '';
let apiOnline = false;
let apiAuthConfig = null;
let apiCurrentPlan = null;
let apiCanSwitchPlans = false;
let apiProfile = null;
let apiBilling = null;
let apiDashboard = null;
let apiDashboardOverview = null;
let apiHabitInsights = null;
let apiReportsHistory = [];
let apiPlans = [];
let selectedRoadmapGoalId = null;

function fmt(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function ym(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function todayStr(){ return fmt(new Date()); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function startOfWeek(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); return nd; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function addMinutesToTime(time, minutes){
  const [h,m] = time.split(':').map(Number);
  const total = h * 60 + m + minutes;
  return `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
}

async function apiFetch(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(apiToken) headers.Authorization = `Bearer ${apiToken}`;
  const res = await fetch(`${API_BASE}${path}`, {...options, headers});
  if(!res.ok){
    const detail = await res.json().catch(()=>({message:res.statusText}));
    throw new Error(Array.isArray(detail.message) ? detail.message.join(', ') : (detail.message || res.statusText));
  }
  return res.status === 204 ? null : res.json();
}

function consumeOAuthRedirect(){
  const hash = window.location.hash && window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
  if(!hash) return false;
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  if(!token) return false;
  apiToken = token;
  apiUserEmail = params.get('email') || apiUserEmail;
  localStorage.setItem('planova:token', apiToken);
  if(apiUserEmail) localStorage.setItem('planova:email', apiUserEmail);
  history.replaceState(null, document.title, window.location.pathname + window.location.search);
  return true;
}

async function getAuthConfig(){
  if(apiAuthConfig) return apiAuthConfig;
  apiAuthConfig = await apiFetch('/auth/config');
  return apiAuthConfig;
}

function logClientIssue(level, message, meta={}){
  fetch(`${API_BASE}/logs/client`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({level, message, source:'planova.html', meta}),
    keepalive:true,
  }).catch(()=>{});
}

window.addEventListener('error', event=>{
  logClientIssue('error', event.message || 'Unhandled browser error', {
    filename:event.filename,
    line:event.lineno,
    column:event.colno,
  });
});

window.addEventListener('unhandledrejection', event=>{
  logClientIssue('error', event.reason && event.reason.message ? event.reason.message : 'Unhandled promise rejection');
});

async function ensureSession(){
  consumeOAuthRedirect();
  if(apiToken) return true;
  const config = await getAuthConfig();
  if(config && config.googleOAuthEnabled && !config.devEmailLoginEnabled){
    window.location.href = config.googleAuthUrl || '/auth/google';
    return false;
  }
  if(config && !config.devEmailLoginEnabled){
    throw new Error('Production login is not configured.');
  }
  const email = apiUserEmail || prompt('Enter your email to connect Planova to the backend:');
  if(!email){
    if(config && config.googleOAuthEnabled) window.location.href = config.googleAuthUrl || '/auth/google';
    return false;
  }
  const session = await apiFetch('/auth/login', {method:'POST', body:JSON.stringify({email})});
  apiToken = session.access_token;
  apiUserEmail = email;
  localStorage.setItem('planova:token', apiToken);
  localStorage.setItem('planova:email', apiUserEmail);
  return true;
}

function taskFromApi(task){
  return {
    id:String(task.id),
    text:task.title,
    date:(task.dueDate || task.startTime || new Date().toISOString()).slice(0,10),
    done:task.status === 'done',
    priority:task.priority ? task.priority <= 3 : true,
    backend:task,
  };
}

function dateFromApi(value){
  return String(value || '').slice(0,10);
}

function timeFromApi(value){
  const text = String(value || '');
  return text.includes('T') ? text.slice(11,16) : text.slice(0,5);
}

function focusBlockFromApi(block){
  const type = block.type || 'focus';
  return {
    id:`focus-${block.id}`,
    rawId:String(block.id),
    backendType:'focusBlock',
    date:dateFromApi(block.start),
    start:timeFromApi(block.start),
    end:timeFromApi(block.end),
    label:block.title || (block.task && block.task.title) || (type === 'break' ? 'Break' : 'Focus block'),
    color:type === 'break' ? 'var(--amber)' : 'var(--green)',
    type,
    backend:block,
  };
}

function goalFromApi(goal){
  const area = LIFE_AREA_META[goal.lifeArea] || LIFE_AREA_META.career;
  return {id:String(goal.id), title:goal.title, icon:area.icon, color:area.color, progress:goal.progress, roadmap:roadmapStats(goal), backend:goal};
}

function roadmapStats(goal){
  const milestones = goal.milestones || [];
  const weeklyFocuses = milestones.flatMap(milestone=>milestone.weeklyFocuses || []);
  const tasks = weeklyFocuses.flatMap(week=>week.tasks || []);
  const nextFocus = weeklyFocuses
    .filter(week=>week.status !== 'completed')
    .sort((a,b)=>String(a.weekStart).localeCompare(String(b.weekStart)))[0] || null;
  return {
    milestones: milestones.length,
    weeklyFocuses: weeklyFocuses.length,
    tasks: tasks.length,
    nextFocus,
  };
}

function habitFromApi(habit){
  const area = LIFE_AREA_META[habit.lifeArea] || LIFE_AREA_META.personal_growth;
  const completions = {};
  (habit.logs || []).forEach(log=>{ if(log.completed) completions[log.date.slice(0,10)] = true; });
  return {id:String(habit.id), name:habit.title, icon:area.icon, color:area.css, completions, backend:habit};
}

function noteFromApi(note){
  return {id:String(note.id), text:note.text, month:note.month || undefined, createdAt:note.createdAt, backendType:'note', backend:note};
}

function importantDateFromApi(item){
  return {id:String(item.id), title:item.title, date:dateFromApi(item.date), backendType:'importantDate', backend:item};
}

function budgetFromApi(budget){
  return {
    id:String(budget.id),
    total:Number(budget.total || 0),
    expenses:(budget.expenses || []).map(expense=>({
      id:String(expense.id),
      name:expense.name,
      amount:Number(expense.amount || 0),
      backendType:'expense',
      backend:expense,
    })),
    backend:budget,
  };
}

async function refreshFromApi(){
  const [goals, tasks, habits, dashboard, dashboardOverview, planInfo, plans, profile, billingInfo, habitInsights, reportsHistory, notes, dates, reflections, monthlyFocuses] = await Promise.all([
    apiFetch('/goals'),
    apiFetch('/tasks'),
    apiFetch('/habits'),
    apiFetch('/dashboard/today').catch(()=>null),
    apiFetch('/dashboard/overview').catch(()=>null),
    apiFetch('/plans/me').catch(()=>null),
    apiFetch('/plans').catch(()=>[]),
    apiFetch('/profile').catch(()=>null),
    apiFetch('/billing/me').catch(()=>null),
    apiFetch('/insights/habits').catch(()=>null),
    apiFetch('/reports/history').catch(()=>[]),
    apiFetch('/personal/notes').catch(()=>[]),
    apiFetch('/personal/dates').catch(()=>[]),
    apiFetch('/personal/reflections').catch(()=>[]),
    apiFetch('/personal/monthly-focus').catch(()=>[]),
  ]);
  apiCurrentPlan = planInfo && planInfo.plan ? planInfo.plan : null;
  apiCanSwitchPlans = Boolean(planInfo && planInfo.devPlanSwitchEnabled);
  apiProfile = profile || null;
  apiBilling = billingInfo || null;
  apiDashboard = dashboard || null;
  apiDashboardOverview = dashboardOverview || null;
  apiHabitInsights = habitInsights || null;
  apiReportsHistory = reportsHistory || [];
  apiPlans = plans || [];
  S.goals = goals.map(goalFromApi);
  S.tasks = tasks.map(taskFromApi);
  S.habits = habits.map(habitFromApi);
  S.notes = notes.map(noteFromApi);
  S.dates = dates.map(importantDateFromApi);
  S.reflections = Object.fromEntries(reflections.map(item=>[dateFromApi(item.date), item.text]));
  S.focus = Object.fromEntries(monthlyFocuses.map(item=>[item.month, item.text]));
  const areaSource = dashboardOverview && dashboardOverview.lifeAreas ? dashboardOverview.lifeAreas : (dashboard && dashboard.lifeAreas ? dashboard.lifeAreas : null);
  if(areaSource){
    S.areas = areaSource.map(area=>{
      const meta = LIFE_AREA_META[area.lifeArea] || LIFE_AREA_META.personal_growth;
      return {id:area.lifeArea, name:meta.name, color:meta.css, progress:area.score};
    });
  }
  apiOnline = true;
  renderProfile();
}

function renderProfile(){
  const name = apiProfile && apiProfile.name ? apiProfile.name : (apiUserEmail ? apiUserEmail.split('@')[0] : 'Local User');
  const plan = apiCurrentPlan ? apiCurrentPlan.name.toUpperCase() : 'LOCAL';
  const initials = name.split(/[.\s_-]/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'PU';
  const avatar = document.querySelector('.avatar');
  const profileName = document.querySelector('.profile-name');
  const profileEmail = document.querySelector('.profile-email');
  if(avatar) avatar.textContent = initials;
  if(profileName) profileName.textContent = name;
  if(profileEmail) profileEmail.textContent = apiOnline ? `${apiUserEmail} · ${plan}` : 'offline local mode';
}
function displayName(){
  if(apiProfile && apiProfile.name) return apiProfile.name;
  if(apiUserEmail) return apiUserEmail.split('@')[0];
  return 'there';
}

/* ============ STORAGE ============ */
async function loadAll(){
  try{
    if(await ensureSession()) await refreshFromApi();
  }catch(e){
    apiOnline = false;
    console.warn('Planova API unavailable, using local data:', e.message);
  }
  if(!apiOnline){
    const entries = await Promise.all(Object.entries(KEYS).map(async ([k,key])=>{
      try{
        const raw = localStorage.getItem(key);
        if(raw) return [k, JSON.parse(raw)];
        if(window.storage){
          const r = await window.storage.get(key,false);
          return [k, r&&r.value ? JSON.parse(r.value) : null];
        }
        return [k, null];
      }
      catch(e){ return [k, null]; }
    }));
    entries.forEach(([k,v])=>{ if(v!==null) S[k]=v; });
    if(S.goals.length===0) seedDefaults();
  }
  renderShell();
  renderProfile();
  renderView();
}
async function save(key){
  try{ localStorage.setItem(KEYS[key], JSON.stringify(S[key])); }catch(e){}
  try{ if(window.storage) await window.storage.set(KEYS[key], JSON.stringify(S[key]), false); }catch(e){}
}
function seedDefaults(){
  S.goals = [
    {id:uid(), title:'Career Growth', icon:'🎯', color:'blue', progress:70},
    {id:uid(), title:'Health & Wellness', icon:'❤️', color:'pink', progress:60},
    {id:uid(), title:'Financial Freedom', icon:'💰', color:'green', progress:45},
    {id:uid(), title:'Learning & Growth', icon:'📚', color:'purple', progress:80},
  ];
  S.areas = [
    {id:uid(), name:'Career', color:'var(--blue)', progress:70},
    {id:uid(), name:'Health', color:'var(--green)', progress:60},
    {id:uid(), name:'Finance', color:'var(--amber)', progress:45},
    {id:uid(), name:'Learning', color:'var(--purple)', progress:80},
    {id:uid(), name:'Relationships', color:'var(--pink)', progress:55},
    {id:uid(), name:'Personal Growth', color:'var(--blue)', progress:65},
  ];
  S.habits = [
    {id:uid(), name:'Workout', icon:'🏋️', color:'var(--green)', completions:{}},
    {id:uid(), name:'Meditate', icon:'🧘', color:'var(--purple)', completions:{}},
    {id:uid(), name:'Read', icon:'📖', color:'var(--blue)', completions:{}},
    {id:uid(), name:'No Sugar', icon:'🍬', color:'var(--pink)', completions:{}},
  ];
  const y = new Date().getFullYear();
  S.dates = [
    {id:uid(), date:`${y}-05-20`, title:'Product Launch'},
    {id:uid(), date:`${y}-06-12`, title:'Team Offsite'},
    {id:uid(), date:`${y}-08-03`, title:'Annual Review'},
  ];
  S.quote = 'The future depends on what you do today. — Mahatma Gandhi';
  save('goals'); save('areas'); save('habits'); save('dates'); save('quote');

/* ============ SHELL (nav + topbar) ============ */
function renderShell(){
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.addEventListener('click', ()=>{ view = b.dataset.view; renderView(); });
  });
}

function setTopbar(title, sub, actionsHtml){
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  const planPicker = apiOnline && apiCanSwitchPlans ? `
    <select id="planPicker" style="border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:9px 12px;font-weight:700;color:var(--ink-soft);">
      ${['free','pro','premium'].map(p=>`<option value="${p}" ${apiCurrentPlan&&apiCurrentPlan.name===p?'selected':''}>${p.toUpperCase()}</option>`).join('')}
    </select>` : '';
  document.getElementById('topbarActions').innerHTML = (actionsHtml||'') + planPicker + `<button class="bell-btn">${ICON.bell}</button>`;
  const picker = document.getElementById('planPicker');
  if(picker){
    picker.onchange = async ()=>{
      try{
        const result = await apiFetch('/plans/me', {method:'PATCH', body:JSON.stringify({plan:picker.value})});
        apiCurrentPlan = result.plan;
        await refreshFromApi();
        renderProfile();
        renderView();
      }catch(e){ alert(e.message); }
    };
  }
  document.querySelectorAll('.nav-item').forEach(b=> b.dataset.active = (b.dataset.view===view && ((view!=='monthly')||b.textContent.includes('Monthly'))) );
}

function renderView(){
  document.querySelectorAll('.view').forEach(v=> v.dataset.active = 'false');
  document.querySelectorAll('.nav-item').forEach(b=> b.dataset.active = String(b.dataset.view===view));
  document.getElementById('view-'+(view==='templates'?'templates':view)).dataset.active = 'true';
  if(view==='home') renderHome();
  else if(view==='annual') renderAnnual();
  else if(view==='monthly') renderMonthly();
  else if(view==='daily') renderDaily();
  else if(view==='goals') renderGoals();
  else if(view==='habits') renderHabits();
  else if(view==='finances') renderFinances();
  else if(view==='notes') renderNotes();
  else renderTemplates();
}

function renderCalGrid(){
  const grid = document.getElementById('calGrid');
  const year=monthCursor.getFullYear(), month=monthCursor.getMonth();
  const first = new Date(year,month,1);
  const startOffset = (first.getDay()+6)%7; // Mon start
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrev = new Date(year,month,0).getDate();
  let cells=[];
  for(let i=0;i<startOffset;i++) cells.push({d:new Date(year,month-1, daysInPrev-startOffset+1+i), muted:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d:new Date(year,month,d), muted:false});
  while(cells.length<42) cells.push({d:new Date(year,month+1, cells.length-(startOffset+daysInMonth)+1), muted:true});
  grid.innerHTML = cells.map(c=>{
    const ds=fmt(c.d); const has = S.tasks.some(t=>t.date===ds);
    return `<button class="cal-cell" data-date="${ds}" data-muted="${c.muted}" data-today="${ds===todayStr()}" data-selected="${ds===selectedMonthDay}">${c.d.getDate()}${has?'<span class="cal-dot"></span>':''}</button>`;
  }).join('');
  grid.querySelectorAll('.cal-cell').forEach(c=> c.addEventListener('click', ()=>{ selectedMonthDay=c.dataset.date; renderCalGrid(); renderMonthPriorities(); }));
}
function renderMonthPriorities(){
  const items = S.tasks.filter(t=>t.date===selectedMonthDay && t.priority).slice(0,3);
  const colors=['var(--green)','var(--blue)','var(--purple)'];
  const box = document.getElementById('monthPriorities');
  if(!box) return;
  box.innerHTML = items.length ? items.map((t,i)=>`
    <div class="priority-item">
      <div class="priority-num" style="background:${colors[i]};">${i+1}</div>
      <div class="priority-text" data-done="${t.done}">${esc(t.text)}</div>
      <button class="pcheck" data-done="${t.done}" data-id="${t.id}"></button>
    </div>`).join('') : '<div class="empty">No priorities set for this day.</div>';
  box.querySelectorAll('.pcheck').forEach(b=> b.addEventListener('click', async ()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.id); if(!t) return;
    t.done=!t.done;
    try{
      if(apiOnline) await apiFetch(`/tasks/${t.id}/status`, {method:'PATCH', body:JSON.stringify({status:t.done?'done':'todo'})});
      else save('tasks');

  }));
}

async function renderUnfinishedTasks(date){
  const box = document.getElementById('unfinishedTasks');
  if(!box) return;
  if(!apiOnline){
    const localItems = S.tasks.filter(t=>t.date<=date && !t.done).slice(0,5);
    box.innerHTML = localItems.length ? localItems.map(t=>`<div class="priority-item"><div class="priority-text">${esc(t.text)}</div></div>`).join('') : '<div class="empty">No unfinished tasks.</div>';
    return;
  }
  box.innerHTML = '<div class="empty">Checking unfinished tasks...</div>';
  try{
    const unfinished = await apiFetch(`/tasks/unfinished?date=${date}`);
    const enriched = await Promise.all(unfinished.slice(0,6).map(async task=>{
      try{
        const options = await apiFetch(`/tasks/${task.id}/reschedule-options?date=${date}`);
        return {...task, rescheduleOptions:options};
      }catch{
        return {...task, rescheduleOptions:null};
      }
    }));
    box.innerHTML = enriched.length ? enriched.map(task=>{
      const slot = task.rescheduleOptions && task.rescheduleOptions.suggestedSlot;
      return `
      <div class="priority-item" style="align-items:flex-start;">
        <div class="priority-text">
          ${esc(task.title)}
          <div class="date-sub">${task.dueDate ? esc(task.dueDate.slice(0,10)) : 'No due date'} · ${task.lifeArea || 'general'}</div>
          ${slot ? `<div class="date-sub">Best slot: ${esc(slot.date)} ${esc(slot.startTime)}-${esc(slot.endTime)}</div>` : ''}
        </div>
        ${slot ? `<button class="link-btn" data-reschedule="custom" data-task="${task.id}" data-due="${slot.date}" data-start="${slot.startDateTime}" data-end="${slot.endDateTime}">Best slot</button>` : ''}
        <button class="link-btn" data-reschedule="tomorrow" data-task="${task.id}">Tomorrow</button>
        <button class="link-btn" data-reschedule="weekend" data-task="${task.id}">Weekend</button>
        <button class="link-btn" data-reschedule="split" data-task="${task.id}">Split</button>
        <button class="sched-del" data-reschedule="no_longer_important" data-task="${task.id}" style="opacity:1;">${ICON.x}</button>
      </div>`;
    }).join('') : '<div class="empty">No unfinished tasks.</div>';
    box.querySelectorAll('[data-reschedule]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const action = btn.dataset.reschedule;
      const taskId = btn.dataset.task;
      const body = {action};
      if(action === 'custom'){
        body.dueDate = btn.dataset.due;
        body.startTime = btn.dataset.start;
        body.endTime = btn.dataset.end;
      }
      if(action === 'split'){
        const parts = prompt('Break this into smaller tasks, separated by commas:');
        if(!parts) return;
        body.parts = parts.split(',').map(x=>x.trim()).filter(Boolean);
      }
      try{
        await apiFetch(`/tasks/${taskId}/reschedule`, {method:'POST', body:JSON.stringify(body)});
        await refreshFromApi();
        renderDaily();
      }catch(e){ alert(e.message); }
    }));
  }catch(e){
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function runCopilot(apply, date){
  const promptEl = document.getElementById('copilotPrompt');
  const resultEl = document.getElementById('copilotResult');
  const prompt = promptEl.value.trim();
  if(!prompt) return;
  if(!apiOnline){ resultEl.innerHTML = '<div class="empty">Connect to the backend to use Copilot.</div>'; return; }
  resultEl.innerHTML = '<div class="empty">Planning...</div>';
  try{
    const path = apply ? '/copilot/daily-plan/apply' : '/copilot/daily-plan';
    const result = await apiFetch(path, {method:'POST', body:JSON.stringify({prompt, date, defaultLifeArea:'career'})});
    const plan = apply ? result.plan : result;
    if(apply){
      await refreshFromApi();
      await loadScheduleFromApi(date);
      renderDayPriorities();
    }
    resultEl.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${(plan.topPriorities||[]).map((p,i)=>`<div class="priority-item"><div class="priority-num" style="background:var(--primary);">${i+1}</div><div class="priority-text">${esc(p)}</div></div>`).join('')}
        ${(plan.focusBlocks||[]).slice(0,4).map(b=>`<div class="sched-row"><div class="sched-time">${esc(b.startTime)}-${esc(b.endTime)}</div><div class="sched-bar" style="background:var(--green);"></div><div class="sched-label">${esc(b.title)}</div></div>`).join('')}
      </div>`;
  }catch(e){
    resultEl.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function loadScheduleFromApi(date){
  const box = document.getElementById('scheduleList');
  try{
    const blocks = await apiFetch(`/planner/focus-blocks?date=${date}`);
    S.sched = S.sched.filter(item=>!(item.backendType === 'focusBlock' && item.date === date));
    S.sched.push(...blocks.map(focusBlockFromApi));
    renderSchedule();
  }catch(e){
    if(box) box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

      <button class="icon-btn" id="hNext">${ICON.chevRight}</button>
    </div>`);
  document.getElementById('hPrev').onclick=()=>{ habitWeekStart=addDays(habitWeekStart,-7); renderHabits(); };
  document.getElementById('hNext').onclick=()=>{ habitWeekStart=addDays(habitWeekStart,7); renderHabits(); };

  const el = document.getElementById('view-habits');
  const days = [0,1,2,3,4,5,6].map(i=>addDays(habitWeekStart,i));
  el.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <div class="card-head"><span class="card-title">Weekly tracker</span></div>
      <table class="habit-table"><thead><tr><th style="text-align:left;">Habit</th>${days.map(d=>`<th>${WEEKDAYS[(d.getDay()+6)%7]}<br>${d.getDate()}</th>`).join('')}<th></th></tr></thead>
      <tbody id="habitBody"></tbody></table>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-head"><span class="card-title">Habit Intelligence</span><span class="bar-pct">${apiCurrentPlan ? apiCurrentPlan.name.toUpperCase() : 'OFFLINE'}</span></div>
      <div id="habitInsights"></div>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">Add a habit</span></div>
      <div class="mini-add">
        <select id="habitIconSel"><option value="🏋️">🏋️ Workout</option><option value="🧘">🧘 Meditate</option><option value="📖">📖 Read</option><option value="💧">💧 Water</option><option value="🍬">🍬 No Sugar</option><option value="🛌">🛌 Sleep</option></select>
        <select id="habitColorSel"><option value="var(--green)">Green</option><option value="var(--blue)">Blue</option><option value="var(--purple)">Purple</option><option value="var(--pink)">Pink</option><option value="var(--amber)">Amber</option></select>
        <input type="text" id="habitNameInput" placeholder="Habit name…" maxlength="40" />
        <button id="habitAddBtn">${ICON.plus}</button>
      </div>
    </div>
  `;
  renderHabitInsights();
  const body = document.getElementById('habitBody');
  body.innerHTML = S.habits.map(h=>`
    <tr>
      <td><div class="habit-name-cell"><span class="habit-emoji" style="background:color-mix(in srgb, ${h.color} 16%, white);">${h.icon}</span>${esc(h.name)}</div></td>
      ${days.map(d=>{ const ds=fmt(d); return `<td><button class="habit-dot" data-h="${h.id}" data-date="${ds}" data-done="${!!h.completions[ds]}"></button></td>`; }).join('')}
      <td><button class="habit-del" data-del="${h.id}">${ICON.x}</button></td>
    </tr>`).join('') || `<tr><td colspan="9"><div class="empty">No habits yet — add one below.</div></td></tr>`;
  body.querySelectorAll('.habit-dot').forEach(b=> b.addEventListener('click', async ()=>{
    const h=S.habits.find(x=>x.id===b.dataset.h); const ds=b.dataset.date;
    if(!h) return;
    const next = !h.completions[ds];
    if(next) h.completions[ds]=true; else delete h.completions[ds];
    try{
      if(apiOnline) await apiFetch(`/habits/${h.id}/logs`, {method:'POST', body:JSON.stringify({date:ds, completed:next})});
      else save('habits');
      renderHabits();
    }catch(e){
      if(next) delete h.completions[ds]; else h.completions[ds]=true;
      alert(e.message);
    }
  }));
  body.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
    const id = b.dataset.del;
    const prev = [...S.habits];
    S.habits=S.habits.filter(x=>x.id!==id);
    try{
      if(apiOnline) await apiFetch(`/habits/${id}`, {method:'DELETE'});
      else save('habits');
      renderHabits();
    }catch(e){ S.habits=prev; alert(e.message); }
  }));
  document.getElementById('habitAddBtn').onclick=async ()=>{
    const name=document.getElementById('habitNameInput').value.trim(); if(!name) return;
    try{
      if(apiOnline){
        const created = await apiFetch('/habits', {method:'POST', body:JSON.stringify({title:name, frequency:'daily', lifeArea:'personal_growth'})});
        S.habits.push(habitFromApi(created));
      }else{
        S.habits.push({id:uid(), name, icon:document.getElementById('habitIconSel').value, color:document.getElementById('habitColorSel').value, completions:{}});
        save('habits');
      }
      document.getElementById('habitNameInput').value=''; renderHabits();
    }catch(e){ alert(e.message); }
  };
}

function renderHabitInsights(){
  const box = document.getElementById('habitInsights');
  if(!box) return;
  if(!apiOnline){
    box.innerHTML = '<div class="empty">Connect to the backend to see habit intelligence.</div>';
    return;
  }
  if(!apiHabitInsights){
    box.innerHTML = '<div class="empty">Premium analytics are available on the Premium plan.</div>';
    return;
  }
  const totals = apiHabitInsights.totals || {};
  const pattern = apiHabitInsights.moodPattern || {};
  const topStreaks = (apiHabitInsights.habitStreaks || []).slice(0,3);
  box.innerHTML = `
    <div class="grid grid-3" style="gap:10px;margin-bottom:14px;">
      <div><div class="stat-num">${totals.completionRate || 0}%</div><div class="stat-label">Completion</div></div>
      <div><div class="stat-num">${totals.moodAverage || '-'}</div><div class="stat-label">Mood avg</div></div>
      <div><div class="stat-num">${pattern.difference === null || pattern.difference === undefined ? '-' : pattern.difference}</div><div class="stat-label">Mood lift</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:${topStreaks.length ? '12px' : '0'};">
      ${(apiHabitInsights.insights || []).map(item=>`<div class="date-sub">${esc(item)}</div>`).join('')}
    </div>
    ${topStreaks.length ? `<div class="mini-icon-row">
      ${topStreaks.map(h=>`<div class="mini-icon"><div class="mini-icon-circle" style="background:var(--primary-soft);">${h.currentStreak}</div><div class="mini-icon-pct">${h.completionRate}%</div><div class="mini-icon-name">${esc(h.title)}</div></div>`).join('')}
    </div>` : ''}
  `;
}

/* ============ FINANCES ============ */
async function renderFinances(){
  setTopbar('Finances', `Budget for ${MONTH_FULL[monthCursor.getMonth()]} ${monthCursor.getFullYear()}.`, `
    <div class="date-nav">
      <button class="icon-btn" id="fPrev">${ICON.chevLeft}</button>
      <span class="date-nav-label">${MONTH_NAMES[monthCursor.getMonth()]} ${monthCursor.getFullYear()}</span>
      <button class="icon-btn" id="fNext">${ICON.chevRight}</button>
    </div>`);
  document.getElementById('fPrev').onclick=()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); renderFinances(); };
  document.getElementById('fNext').onclick=()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); renderFinances(); };

  const key = ym(monthCursor);
  if(apiOnline && (!S.budget[key] || !S.budget[key].backend)) await loadBudgetFromApi(key);
  if(!S.budget[key]) S.budget[key] = {total:0, expenses:[]};
  const b = S.budget[key];
  const spent = b.expenses.reduce((a,e)=>a+Number(e.amount),0);
  const pct = b.total>0 ? Math.min(100, Math.round(spent/b.total*100)) : 0;

  const el = document.getElementById('view-finances');
  el.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><span class="card-title">Monthly budget</span></div>
        <div class="mini-add" style="margin-bottom:14px;"><input type="number" id="budgetTotalInput" placeholder="Total budget" value="${b.total||''}" min="0" /><button id="budgetSaveBtn">Set</button></div>
        <div class="budget-amt">$${spent.toLocaleString()}</div>
        <div class="budget-of">of $${Number(b.total).toLocaleString()} spent</div>
        <div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:${pct}%;background:${pct>90?'var(--red)':'var(--primary)'};"></div></div>
        <div class="bar-pct" style="margin-top:6px;">${pct}%</div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Expenses</span></div>
        <div id="expenseList" style="margin-bottom:12px;"></div>
        <div class="mini-add"><input type="text" id="expNameInput" placeholder="Expense name" maxlength="40" /><input type="number" id="expAmtInput" placeholder="$" min="0" style="flex:0 0 90px;" /><button id="expAddBtn">${ICON.plus}</button></div>
      </div>
    </div>
  `;
  renderExpenseList();
  document.getElementById('budgetSaveBtn').onclick=async ()=>{
    const old = b.total;
    b.total = Number(document.getElementById('budgetTotalInput').value)||0;
    try{
      if(apiOnline){
        const updated = await apiFetch('/personal/budget', {method:'PUT', body:JSON.stringify({month:key, total:b.total})});
        S.budget[key] = budgetFromApi(updated);
      }else{
        save('budget');
      }
      renderFinances();
    }catch(e){ b.total = old; alert(e.message); renderFinances(); }
  };
  document.getElementById('expAddBtn').onclick=async ()=>{
    const name=document.getElementById('expNameInput').value.trim(); const amt=Number(document.getElementById('expAmtInput').value);
    if(!name || !amt) return;
    try{
      if(apiOnline){
        const created = await apiFetch('/personal/budget/expenses', {method:'POST', body:JSON.stringify({month:key, name, amount:amt})});
        b.expenses.unshift({id:String(created.id), name:created.name, amount:Number(created.amount), backendType:'expense', backend:created});
      }else{
        b.expenses.push({id:uid(), name, amount:amt}); save('budget');
      }
      document.getElementById('expNameInput').value=''; document.getElementById('expAmtInput').value='';
      renderFinances();
    }catch(e){ alert(e.message); }
  };
}

async function loadBudgetFromApi(month){
  try{
    const budget = await apiFetch(`/personal/budget?month=${month}`);
    S.budget[month] = budgetFromApi(budget);
  }catch(e){
    if(!S.budget[month]) S.budget[month] = {total:0, expenses:[]};
    console.warn('Budget load failed:', e.message);
  }
}

function renderExpenseList(){
  const key = ym(monthCursor); const b = S.budget[key];
  const box = document.getElementById('expenseList');
  box.innerHTML = b.expenses.length ? b.expenses.map(e=>`
    <div class="expense-row"><span>${esc(e.name)}</span><span style="display:flex;align-items:center;gap:8px;">$${Number(e.amount).toLocaleString()}<button class="expense-del" data-id="${e.id}">${ICON.x}</button></span></div>
  `).join('') : '<div class="empty">No expenses logged yet.</div>';
  box.querySelectorAll('[data-id]').forEach(btn=> btn.addEventListener('click', async ()=>{
    const id = btn.dataset.id;
    const item = b.expenses.find(x=>x.id===id);
    const prev = [...b.expenses];
    b.expenses=b.expenses.filter(x=>x.id!==id);
    try{
      if(apiOnline && item && item.backendType === 'expense') await apiFetch(`/personal/budget/expenses/${id}`, {method:'DELETE'});
      else save('budget');
      renderExpenseList(); renderFinances();
    }catch(e){ b.expenses = prev; alert(e.message); renderExpenseList(); renderFinances(); }
  }));
}

/* ============ NOTES ============ */
function renderNotes(){
  setTopbar('Notes', 'Freeform notes, ideas, and things to remember.');
  const el = document.getElementById('view-notes');
  el.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <div class="mini-add"><input type="text" id="noteInput" placeholder="Write a note…" maxlength="200" /><button id="noteAddBtn">${ICON.plus}</button></div>
    </div>
    <div class="grid grid-3" id="notesGrid"></div>
  `;
  renderNotesGrid();
  document.getElementById('noteAddBtn').onclick=async ()=>{
    const inp=document.getElementById('noteInput'); const text=inp.value.trim(); if(!text) return;
    try{
      if(apiOnline){
        const created = await apiFetch('/personal/notes', {method:'POST', body:JSON.stringify({text})});
        S.notes.unshift(noteFromApi(created));
      }else{
        S.notes.unshift({id:uid(), text, createdAt:Date.now()}); save('notes');
      }
      inp.value=''; renderNotesGrid();
    }catch(e){ alert(e.message); }
  };
}
function renderNotesGrid(){
  const items = S.notes.filter(n=>!n.month);
  document.getElementById('notesGrid').innerHTML = items.length ? items.map(n=>`
    <div class="note-card">
      <button class="note-del" data-id="${n.id}">${ICON.x}</button>
      <div class="note-txt">${esc(n.text)}</div>
      <div class="note-meta">${new Date(n.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
    </div>`).join('') : '<div class="empty">No notes yet — write your first above.</div>';
  document.querySelectorAll('#notesGrid [data-id]').forEach(b=> b.addEventListener('click', async ()=>{
    const id = b.dataset.id;
    const item = S.notes.find(x=>x.id===id);
    const prev = [...S.notes];
    S.notes=S.notes.filter(x=>x.id!==id);
    try{
      if(apiOnline && item && item.backendType === 'note') await apiFetch(`/personal/notes/${id}`, {method:'DELETE'});
      else save('notes');
      renderNotesGrid();
    }catch(e){ S.notes=prev; alert(e.message); renderNotesGrid(); }
  }));
}

/* ============ TEMPLATES (placeholder) ============ */
async function renderTemplates(){
  setTopbar('Templates', 'Ready-made layouts to jump-start your planning.');
  const el = document.getElementById('view-templates');
  el.innerHTML = `<div class="card"><div class="empty">Loading templates...</div></div>`;
  if(!apiOnline){
    el.innerHTML = `<div class="card"><div class="empty">Connect to the backend to use starter templates.</div></div>`;
    return;
  }
  try{
    const [templates, plans] = await Promise.all([
      apiFetch('/templates/starter'),
      apiPlans.length ? Promise.resolve(apiPlans) : apiFetch('/plans').catch(()=>[]),
    ]);
    apiPlans = plans || [];
    const billingReady = Boolean(apiBilling && apiBilling.checkoutEnabled);
    const portalReady = Boolean(apiBilling && apiBilling.portalEnabled && apiBilling.user && apiBilling.user.stripeCustomerId);
    const canCheckoutPlan = plan => billingReady && plan.name !== 'free' && apiBilling.prices && apiBilling.prices[plan.name];
    const planButtonAttrs = plan => {
      if(apiCurrentPlan && apiCurrentPlan.name === plan.name){
        return portalReady ? 'data-portal="true"' : '';
      }
      if(apiCanSwitchPlans) return `data-plan="${plan.name}"`;
      if(canCheckoutPlan(plan)) return `data-checkout="${plan.name}"`;
      return '';
    };
    const planButtonLabel = plan => {
      if(apiCurrentPlan && apiCurrentPlan.name === plan.name) return portalReady ? 'Manage billing' : 'Current plan';
      if(apiCanSwitchPlans) return 'Use plan';
      if(canCheckoutPlan(plan)) return `Subscribe to ${plan.name.toUpperCase()}`;
      return 'Billing required';
    };
    el.innerHTML = `
      <div class="card" style="margin-bottom:18px;">
        <div class="card-head"><span class="card-title">Plans</span><span class="bar-pct">${apiCurrentPlan ? apiCurrentPlan.name.toUpperCase() : 'LOCAL'}</span></div>
        <div class="grid grid-3">
          ${apiPlans.map(plan=>`
            <div class="goal-card">
              <div class="goal-icon" style="background:${plan.name==='free'?'var(--blue-soft)':plan.name==='pro'?'var(--green-soft)':'var(--purple-soft)'};">${plan.name==='free'?'F':plan.name==='pro'?'P':'★'}</div>
              <div class="goal-title">${esc(plan.name.toUpperCase())}</div>
              <div class="roadmap-meta">
                <div class="roadmap-pill"><strong>${plan.limits.tasks === null ? '∞' : plan.limits.tasks}</strong><span>Tasks</span></div>
                <div class="roadmap-pill"><strong>${plan.limits.goals === null ? '∞' : plan.limits.goals}</strong><span>Goals</span></div>
                <div class="roadmap-pill"><strong>${plan.limits.habits === null ? '∞' : plan.limits.habits}</strong><span>Habits</span></div>
              </div>
              <div class="plan-feature-list">
                ${plan.features.slice(0,6).map(feature=>`<div>${esc(feature.replace(/_/g,' '))}</div>`).join('')}
              </div>
              <button class="link-btn" data-primary="true" ${planButtonAttrs(plan)}>${planButtonLabel(plan)}</button>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="grid grid-2" id="templatesGrid">
        ${templates.map(t=>`
          <div class="goal-card">
            <div class="goal-icon" style="background:var(--primary-soft);">${ICON.templates}</div>
            <div class="goal-title">${esc(t.mode.replace(/_/g,' '))}</div>
            <div class="bar-pct" style="margin-bottom:10px;">${t.goals.length} goals · ${t.habits.length} habits · ${t.tasks.length} tasks</div>
            <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
              ${t.tasks.slice(0,2).map(task=>`<div class="date-sub">${esc(task.title)}</div>`).join('')}
            </div>
            <button class="link-btn" data-primary="true" data-template="${t.mode}">Apply template</button>
          </div>
        `).join('')}
      </div>`;
    el.querySelectorAll('[data-plan]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const plan = btn.dataset.plan;
      if(apiCurrentPlan && apiCurrentPlan.name === plan) return;
      try{
        btn.textContent = 'Switching...';
        const result = await apiFetch('/plans/me', {method:'PATCH', body:JSON.stringify({plan})});
        apiCurrentPlan = result.plan;
        renderProfile();
        renderTemplates();
      }catch(e){ alert(e.message); renderTemplates(); }
    }));
    el.querySelectorAll('[data-checkout]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const plan = btn.dataset.checkout;
      try{
        btn.textContent = 'Opening checkout...';
        const result = await apiFetch('/billing/checkout', {method:'POST', body:JSON.stringify({plan})});
        if(!result.url) throw new Error('Stripe did not return a checkout URL');
        window.location.href = result.url;
      }catch(e){ alert(e.message); renderTemplates(); }
    }));
    el.querySelectorAll('[data-portal]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{
        btn.textContent = 'Opening billing...';
        const result = await apiFetch('/billing/portal', {method:'POST'});
        if(!result.url) throw new Error('Stripe did not return a portal URL');
        window.location.href = result.url;
      }catch(e){ alert(e.message); renderTemplates(); }
    }));
    el.querySelectorAll('[data-template]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{
        const mode = btn.dataset.template;
        btn.textContent = 'Applying...';
        await apiFetch('/profile', {method:'PATCH', body:JSON.stringify({mode})});
        await apiFetch(`/templates/starter/${mode}/apply`, {method:'POST'});
        await refreshFromApi();
        view = 'home';
        renderView();
      }catch(e){ alert(e.message); renderTemplates(); }
    }));
  }catch(e){
    el.innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`;
  }
}

loadAll();
</script>
</body>
